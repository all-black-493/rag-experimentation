# Render Blueprint: the backend half of the deployment. The frontend is served
# from Cloudflare Pages (see wrangler.toml and functions/) and reaches the API
# through a Pages Function that carries PROXY_SECRET.
#
# Sizing comes from measurement, not guesswork: the app idles at ~925MB with both
# models loaded (torch + bge-small + the cross-encoder), Weaviate at ~125MB.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo. You'll be asked
# for the `sync: false` values on first deploy.
services:
  - type: pserv
    name: rag-weaviate
    runtime: image
    image:
      # Docker Hub, not cr.weaviate.io: Render can only pull from the registries it
      # supports, and its validator rejects the Weaviate registry outright.
      url: docker.io/semitechnologies/weaviate:1.28.4
    plan: starter
    region: frankfurt
    # Mirrors docker-compose.yml. Anonymous access is fine: a private service
    # has no public hostname and only rag-app can reach it.
    envVars:
      - key: QUERY_DEFAULTS_LIMIT
        value: "25"
      - key: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
        value: "true"
      - key: PERSISTENCE_DATA_PATH
        value: /var/lib/weaviate
      - key: DEFAULT_VECTORIZER_MODULE
        value: none
      - key: ENABLE_MODULES
        value: ""
      - key: CLUSTER_HOSTNAME
        value: node1
    disk:
      name: weaviate-data
      mountPath: /var/lib/weaviate
      sizeGB: 1

  - type: web
    name: rag-app
    runtime: docker
    plan: standard
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: WEAVIATE_HOST
        fromService:
          name: rag-weaviate
          type: pserv
          property: host
      - key: ANTHROPIC_API_KEY
        sync: false
      # Generated once here; paste the same value into the Pages project as its
      # PROXY_SECRET. Requests without it are refused (app/proxy_auth.py).
      - key: PROXY_SECRET
        generateValue: true
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_ENVIRONMENT
        value: production
      # Local models mean no provider quota, so ingestion can run wider than the
      # rate-limited default. Two is still right for a 2GB box.
      - key: INGEST_CONCURRENCY
        value: "2"
    # Uploads, thumbnails and the embedding cache all live under /app/data, so
    # one disk keeps everything - and the cache - across deploys.
    disk:
      name: rag-data
      mountPath: /app/data
      sizeGB: 2
