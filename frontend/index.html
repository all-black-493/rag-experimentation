<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="brand">
        <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M6 16.5 12 7l6 9.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="6" cy="16.5" r="1.8" fill="currentColor" />
          <circle cx="12" cy="7" r="1.8" fill="currentColor" />
          <circle cx="18" cy="16.5" r="1.8" fill="currentColor" />
        </svg>
        <span class="brand__name">Ask my docs</span>
      </span>
    </header>

    <div class="body">
      <aside class="sidebar" aria-labelledby="sources-heading">
        <h2 id="sources-heading" class="sidebar__heading">Sources</h2>

        <form id="url-form" class="stack-form" novalidate>
          <label class="field" for="url-input">Add links (up to 3, one per line)</label>
          <textarea
            id="url-input"
            name="url"
            rows="2"
            placeholder="https://example.com/article"
            autocomplete="off"
            required
          ></textarea>
          <button type="submit" class="btn btn--secondary" id="url-submit">Add</button>
        </form>

        <label class="field" for="file-input">Upload files (up to 5)</label>
        <label class="dropzone" id="dropzone" for="file-input" tabindex="0">
          <input
            type="file"
            id="file-input"
            name="file"
            accept=".pdf,.txt,.md,.markdown"
            multiple
            hidden
          />
          <span class="dropzone__text">Drop Files</span>
          <span class="dropzone__hint">PDF &middot; Markdown &middot; TXT</span>
        </label>

        <div id="ingest-progress" class="progress" hidden>
          <div class="progress__bar"></div>
        </div>
        <p id="ingest-status" class="status" role="status" aria-live="polite"></p>

        <div class="sidebar__divider"></div>

        <h3 class="sidebar__subheading">This session</h3>
        <ul id="sources-list" class="sources-list">
          <li class="empty-state" data-placeholder>Nothing added yet.</li>
        </ul>
      </aside>

      <main class="main" aria-labelledby="ask-heading">
        <div class="composer">
          <h2 id="ask-heading" class="visually-hidden">Ask a question</h2>
          <form id="ask-form" novalidate>
            <textarea
              id="question-input"
              name="question"
              rows="1"
              placeholder="Ask a question about your sources"
              required
            ></textarea>
            <button type="submit" class="btn btn--primary" id="ask-submit">Ask</button>
          </form>
        </div>

        <div id="thread" class="thread">
          <p class="empty-state empty-state--main" data-placeholder>
            Passage citations.
          </p>
        </div>
      </main>

      <aside id="pdf-viewer" class="pdf-viewer" hidden aria-labelledby="pdf-viewer-title">
        <div class="pdf-viewer__header">
          <button
            type="button"
            class="pdf-viewer__toggle"
            id="pdf-viewer-toggle"
            aria-expanded="true"
            aria-controls="pdf-viewer-body"
          >
            <svg class="pdf-viewer__chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="m6 4 4 4-4 4"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span id="pdf-viewer-title" class="pdf-viewer__title"></span>
          </button>
          <button type="button" class="pdf-viewer__close" id="pdf-viewer-close" aria-label="Close">
            &times;
          </button>
        </div>
        <div class="pdf-viewer__body" id="pdf-viewer-body">
          <div class="pdf-viewer__page-wrap">
            <canvas id="pdf-viewer-canvas"></canvas>
            <div id="pdf-viewer-highlight" class="pdf-viewer__highlight" hidden></div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="api.js"></script>
  <script src="pdf-viewer.js"></script>
  <script src="app.js"></script>
</body>
</html>
