name: Faithfulness eval

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    # Ingesting the corpus slice on a 2-core runner plus 36 full RAG turns and
    # a ragas judge call each, against rate-limited providers.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Write app env file
        run: |
          cat > backend/.env <<EOF
          # Embeddings and reranking run locally; this is only needed if a run
          # sets EMBEDDING_PROVIDER/RERANKER_PROVIDER back to cohere.
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          EOF

      - name: Unit tests
        working-directory: backend
        run: uv sync --frozen && uv run ruff check app tests eval && uv run pytest -q

      - name: Start app stack
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8010/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          docker compose logs
          exit 1

      - name: Ingest the corpus slice
        # The golden documents plus distractors, in the corpus's own format.
        # The catalog is inspected at startup, so the app restarts afterwards
        # to see what was just indexed.
        run: |
          docker compose cp backend/eval/fixtures/corpus_slice.json app:/tmp/corpus_slice.json
          docker compose exec -T app python -m app.corpus.ingest /tmp/corpus_slice.json
          docker compose restart app
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8010/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8010/catalog

      - name: Install eval dependencies
        working-directory: backend/eval
        run: uv sync

      - name: Retrieval benchmark
        working-directory: backend/eval
        run: uv run python retrieval_benchmark.py --label planner

      - name: Run faithfulness evaluation
        working-directory: backend/eval
        # Unbuffered: stdout is a pipe here, so without this the progress lines
        # sit in the buffer and are lost entirely if the job is cancelled.
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run python run_eval.py --anthropic-api-key "${{ secrets.ANTHROPIC_API_KEY }}"

      - name: Dump app logs
        # Not failure() alone: a timeout cancels the job, which would skip this
        # step exactly when the logs are most needed.
        if: '!success()'
        run: docker compose logs --no-color --tail 200 app

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval/report.json

      - name: Tear down stack
        if: always()
        run: docker compose down -v
