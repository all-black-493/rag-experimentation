services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Opt-in: `docker compose --profile scanning up -d`. Behind a profile because
  # the signature database makes this image large and slow to become ready, and
  # the eval workflow shouldn't pay that on every run. Set MALWARE_SCAN_ENABLED
  # alongside it, or the app won't call the scanner.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scanning"]
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  app:
    build: .
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      WEAVIATE_HOST: weaviate
      # Passed through explicitly: a shell-level MALWARE_SCAN_ENABLED is used for
      # compose substitution only and never reaches the container, which silently
      # leaves scanning off when you believe you turned it on.
      MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
    volumes:
      - pdf_uploads:/app/data/uploads
    depends_on:
      weaviate:
        condition: service_healthy
    restart: on-failure

volumes:
  weaviate_data:
  pdf_uploads:
