services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build: ./backend
    ports:
      - "8010:8000"
    env_file:
      - ./backend/.env
    environment:
      WEAVIATE_HOST: weaviate
      # Passed through explicitly so the proxy gate can be exercised locally:
      # a shell-level variable is used for compose substitution only and never
      # reaches the container on its own.
      PROXY_SECRET: ${PROXY_SECRET:-}
      # The agentic layer's switch, for the retrieval benchmark's baseline:
      #   PLANNER_ENABLED=false docker compose up -d app
      PLANNER_ENABLED: ${PLANNER_ENABLED:-true}
      GRAPH_EXPANSION_ENABLED: ${GRAPH_EXPANSION_ENABLED:-true}
      RERANK_WITH_TITLE: ${RERANK_WITH_TITLE:-true}
      # Local models: LLM_PROVIDER=ollama docker compose --profile ollama up -d
      # then `docker compose exec ollama ollama pull qwen3:8b`. A host install
      # instead of the service: OLLAMA_BASE_URL=http://host.docker.internal:11434.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-qwen3:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The embedding cache has to outlive the container or it isn't a cache:
      # without this every `up --build` re-embeds the whole corpus.
      - embedding_cache:/app/data/embeddings
      # Matters: the uploaded originals and each matter's record.
      - matter_data:/app/data/matters
      # The corpus, for the ingest CLI:
      #   docker compose exec app python -m app.corpus.ingest /corpus/all_chunks.json
      - ./corpus:/corpus:ro
    depends_on:
      weaviate:
        condition: service_healthy
    restart: on-failure

  # Local models, opt in: --profile ollama. CPU by default; for an NVIDIA GPU
  # add the device reservation below and install the NVIDIA Container Toolkit
  # (https://github.com/ollama/ollama/blob/main/docs/docker.mdx).
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  weaviate_data:
  matter_data:
  embedding_cache:
  ollama_data:
