[project]
name = "rag"
version = "0.1.0"
description = "Production-grade RAG system: ingestion, Weaviate retrieval, and cited generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-text-splitters>=1.0",
    "langchain-weaviate>=0.0.8",
    "langchain-cohere>=0.4",
    "langchain-anthropic>=1.0",
    "weaviate-client>=4.9",
    "pydantic-settings>=2.6",
    "tiktoken>=0.8",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "asyncer>=0.0.8",
    "pyyaml>=6.0",
    "slowapi>=0.1.9",
    "langfuse>=4.15.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
