[project]
name = "kenya-law-rag"
version = "0.1.0"
description = "Legal research over Kenyan legislation and case law: agentic retrieval with cited answers"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-text-splitters>=1.0",
    "langchain-cohere>=0.4",
    "langchain-anthropic>=1.0",
    "weaviate-client>=4.9",
    "pydantic-settings>=2.6",
    "tiktoken>=0.8",
    "httpx>=0.27",
    "asyncer>=0.0.8",
    "pyyaml>=6.0",
    "slowapi>=0.1.9",
    "langfuse>=4.15.2",
    "sentence-transformers>=3.0",
    # Declared directly so [tool.uv.sources] can pin it to the CPU wheel -
    # source overrides only apply to a project's own dependencies, and as a
    # transitive dep of sentence-transformers it resolved to the CUDA build.
    "torch>=2.4",
    "sentencepiece>=0.2.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

# CPU-only torch. The default wheel pulls ~3.2GB of CUDA libraries plus ~900MB of
# triton, none of which a CPU inference container can use - it made the venv
# 5.8GB instead of ~1.5GB.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
